name: Build Omarchy Initial Desktop Image

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-rootfs:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install host build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y debootstrap zstd curl tar

      - name: Build pinned Chromium, Playwright and Node from verified public sources
        run: |
          python3 scripts/build-browser-bundle.py --sources scripts/browser-bundle-sources.json \
            --cache-dir "$RUNNER_TEMP/browser-sources" --output-dir "$RUNNER_TEMP/browser-bundle"

      - name: Build clean Ubuntu 24.04 ARM64 Omarchy rootfs
        run: |
          ROOTFS=/tmp/omarchy-rootfs
          sudo mkdir "$ROOTFS"
          sudo debootstrap --arch=arm64 --variant=minbase noble "$ROOTFS" http://ports.ubuntu.com/ubuntu-ports

          sudo bash scripts/stage-core.sh "$ROOTFS"
          sudo install -d "$ROOTFS/usr/share/doc/omarchy-image"
          sudo install -m644 LICENSE LICENSES.md apps/android/COPYING "$ROOTFS/usr/share/doc/omarchy-image/"
          test -d "$ROOTFS/opt" && test ! -L "$ROOTFS/opt"
          for component in omarchy-node omarchy-chromium128; do
            test ! -e "$ROOTFS/opt/$component"
            sudo mv -T "$RUNNER_TEMP/browser-bundle/managed-core/files/opt/$component" "$ROOTFS/opt/$component"
            sudo chown -R 0:0 "$ROOTFS/opt/$component"
          done

          sudo cp -L --remove-destination /etc/resolv.conf "$ROOTFS/etc/resolv.conf"
          sudo mount --bind /dev "$ROOTFS/dev"
          sudo mount --bind /proc "$ROOTFS/proc"
          sudo mount --bind /sys "$ROOTFS/sys"

          sudo chroot "$ROOTFS" /bin/bash -e <<'CHROOT'
          set -o pipefail
          export DEBIAN_FRONTEND=noninteractive
          DOC=/usr/share/doc/omarchy-image
          SOURCES="$DOC/upstream-components.tsv"
          printf 'component\tversion\tupstream source\n' > "$SOURCES"
          record_source() { printf '%s\t%s\t%s\n' "$1" "$2" "$3" >> "$SOURCES"; }
          cat > /etc/apt/sources.list <<'SRC'
          deb http://ports.ubuntu.com/ubuntu-ports noble main restricted universe multiverse
          deb http://ports.ubuntu.com/ubuntu-ports noble-updates main restricted universe multiverse
          deb http://ports.ubuntu.com/ubuntu-ports noble-security main restricted universe multiverse
          SRC
          apt-get update -qq
          apt-get install -y --no-install-recommends \
            ca-certificates sudo locales tzdata dbus dbus-x11 x11-xserver-utils fontconfig gnupg \
            libnss3 libnspr4 \
            waybar wofi swaybg mako-notifier libnotify-bin wl-clipboard wtype \
            alacritty thunar neovim tmux btop fzf ripgrep fd-find jq \
            imv zathura zathura-pdf-poppler mpv \
            git gh curl wget unzip zstd xz-utils webp imagemagick \
            fonts-noto-cjk fonts-noto-color-emoji fonts-dejavu-core papirus-icon-theme \
            python3 python3-gi gir1.2-gtk-3.0 gir1.2-gdkpixbuf-2.0 gir1.2-gtklayershell-0.1 gir1.2-webkit2-4.1 \
            grim slurp \
            fcitx5 fcitx5-chinese-addons fcitx5-frontend-gtk3 fcitx5-frontend-gtk4 fcitx5-frontend-qt5 \
            build-essential ninja-build pkg-config scdoc python3-pip \
            libexpat1-dev libffi-dev libevdev-dev libmtdev-dev \
            libwayland-dev wayland-protocols libpixman-1-dev libxkbcommon-dev \
            libdrm-dev libinput-dev libudev-dev libseat-dev libgbm-dev \
            libxcb1-dev libxcb-composite0-dev libxcb-render-util0-dev libxcb-xfixes0-dev \
            libxcb-icccm4-dev libxcb-xinput-dev libxcb-shm0-dev libxcb-present-dev \
            libxcb-dri3-dev libxcb-res0-dev libxcb-ewmh-dev \
            libjson-c-dev libpcre2-dev libcairo2-dev libpango1.0-dev libgdk-pixbuf-2.0-dev

          # Upgrade meson to >=1.5 (Ubuntu 24.04 apt meson 1.3.2 doesn't support c_std=c23)
          pip3 install --break-system-packages 'meson>=1.5,<1.8'

          # Build wayland 1.23.1 + wayland-protocols 1.38 + wlroots 0.18.2 + sway 1.10.1
          # (pure SHM/Pixman X11 backend WITHOUT DRI3 DRM FD — required for Android PRoot!)
          export PKG_CONFIG_PATH=/usr/local/lib/aarch64-linux-gnu/pkgconfig:/usr/local/lib/pkgconfig:/usr/local/share/pkgconfig
          export PATH=/usr/local/bin:$PATH
          mkdir -p /tmp/build-sway
          cd /tmp/build-sway

          curl -fsSL "https://gitlab.freedesktop.org/wayland/wayland/-/releases/1.23.1/downloads/wayland-1.23.1.tar.xz" | tar -xJ
          cd wayland-1.23.1
          meson setup build --prefix=/usr/local -Ddocumentation=false -Dtests=false -Ddtd_validation=false
          ninja -C build -j$(nproc)
          ninja -C build install
          ldconfig

          cd /tmp/build-sway
          curl -fsSL "https://gitlab.freedesktop.org/wayland/wayland-protocols/-/releases/1.38/downloads/wayland-protocols-1.38.tar.xz" | tar -xJ
          cd wayland-protocols-1.38
          meson setup build --prefix=/usr/local -Dtests=false
          ninja -C build -j$(nproc)
          ninja -C build install

          cd /tmp/build-sway
          curl -fsSL "https://gitlab.freedesktop.org/libinput/libinput/-/archive/1.26.2/libinput-1.26.2.tar.gz" | tar -xz
          cd libinput-1.26.2
          meson setup build --prefix=/usr/local -Dlibwacom=false -Ddebug-gui=false -Dtests=false -Ddocumentation=false -Dzshcompletiondir=no -Dudev-dir=/usr/local/lib/udev
          ninja -C build -j$(nproc)
          ninja -C build install
          ldconfig

          cd /tmp/build-sway
          curl -fsSL "https://gitlab.freedesktop.org/wlroots/wlroots/-/releases/0.18.2/downloads/wlroots-0.18.2.tar.gz" | tar -xz
          cd wlroots-0.18.2
          # Force pure SHM/Pixman X11 backend without DRI3 DRM FD
          sed -i 's/x11->have_dri3 = true;/x11->have_dri3 = false;/g' backend/x11/backend.c || true
          meson setup build --prefix=/usr/local -Dbackends=x11 -Drenderers= -Dallocators= -Dxwayland=disabled -Dexamples=false
          ninja -C build -j$(nproc)
          ninja -C build install
          ldconfig

          cd /tmp/build-sway
          curl -fsSL "https://github.com/swaywm/sway/releases/download/1.10.1/sway-1.10.1.tar.gz" | tar -xz
          cd sway-1.10.1
          meson setup build --prefix=/usr/local -Dman-pages=disabled -Dtray=disabled
          ninja -C build -j$(nproc)
          ninja -C build install
          cd /
          for dir in /tmp/build-sway/*; do
            component=${dir##*/}
            install -d "$DOC/$component"
            find "$dir" -maxdepth 1 -type f \( -iname 'LICENSE*' -o -iname 'COPYING*' \) -exec cp -t "$DOC/$component" {} +
          done
          record_source wayland 1.23.1 https://gitlab.freedesktop.org/wayland/wayland/-/tags/1.23.1
          record_source wayland-protocols 1.38 https://gitlab.freedesktop.org/wayland/wayland-protocols/-/tags/1.38
          record_source libinput 1.26.2 https://gitlab.freedesktop.org/libinput/libinput/-/tags/1.26.2
          record_source wlroots 0.18.2 https://gitlab.freedesktop.org/wlroots/wlroots/-/tags/0.18.2
          record_source sway 1.10.1 https://github.com/swaywm/sway/tree/1.10.1
          rm -rf /tmp/build-sway
          /usr/local/bin/sway --version

          sed -i 's/# zh_CN.UTF-8 UTF-8/zh_CN.UTF-8 UTF-8/' /etc/locale.gen
          sed -i 's/# en_US.UTF-8 UTF-8/en_US.UTF-8 UTF-8/' /etc/locale.gen
          locale-gen zh_CN.UTF-8 en_US.UTF-8 >/dev/null
          ln -sf /usr/share/zoneinfo/Asia/Shanghai /etc/localtime
          echo "Asia/Shanghai" > /etc/timezone

          # Install JetBrainsMono Nerd Font + Omarchy icon font (fixes Waybar & UI icons)
          mkdir -p /usr/share/fonts/truetype/omarchy /usr/share/fonts/truetype/jetbrains-mono-nerd
          FONT_VER=$(curl -fsSL https://api.github.com/repos/ryanoasis/nerd-fonts/releases/latest | jq -er .tag_name)
          FONT_URL="https://github.com/ryanoasis/nerd-fonts/releases/download/$FONT_VER/JetBrainsMono.tar.xz"
          record_source JetBrainsMonoNerdFont "$FONT_VER" "$FONT_URL"
          mkdir /tmp/nerd-font
          curl -fsSL --retry 3 "$FONT_URL" | tar -xJ -C /tmp/nerd-font
          find /tmp/nerd-font -type f \( -name '*NerdFont-Regular.ttf' -o -name '*NerdFont-Bold.ttf' -o -name '*NerdFontMono-Regular.ttf' -o -name '*NerdFontPropo-Regular.ttf' \) -exec cp -t /usr/share/fonts/truetype/jetbrains-mono-nerd {} +
          test -n "$(ls -A /usr/share/fonts/truetype/jetbrains-mono-nerd)"
          mkdir "$DOC/JetBrainsMonoNerdFont"
          find /tmp/nerd-font -type f \( -iname '*license*' -o -iname 'OFL*' \) -exec cp -t "$DOC/JetBrainsMonoNerdFont" {} +

          # Install lazygit and the license shipped with the upstream binary.
          curl -fsSL --retry 3 https://api.github.com/repos/jesseduffield/lazygit/releases/latest -o /tmp/lazygit-release.json
          LG_TAG=$(jq -er .tag_name /tmp/lazygit-release.json)
          LG_URL=$(jq -er '[.assets[] | select(.name | ascii_downcase | endswith("_linux_arm64.tar.gz")) | .browser_download_url] | select(length == 1) | .[0]' /tmp/lazygit-release.json)
          record_source lazygit "$LG_TAG" "$LG_URL"
          mkdir /tmp/lazygit "$DOC/lazygit"
          curl -fsSL --retry 3 "$LG_URL" | tar -xz -C /tmp/lazygit
          install -m755 /tmp/lazygit/lazygit /usr/local/bin/lazygit
          install -m644 /tmp/lazygit/LICENSE "$DOC/lazygit/"

          # Install official Omarchy assets; this checkout's core was staged before chroot
          mkdir -p /root/.local/share/applications /root/.local/share/icons/hicolor/256x256/apps /usr/share/pixmaps /root/.config/sway /root/.config/fcitx5 /root/.config/omarchy /root/.config/alacritty
          git clone --depth 1 https://github.com/basecamp/omarchy.git /root/.local/share/omarchy
          record_source omarchy "$(git -C /root/.local/share/omarchy rev-parse HEAD)" https://github.com/basecamp/omarchy
          find /root/.local/share/omarchy -maxdepth 3 -name "*.ttf" -exec cp -f {} /usr/share/fonts/truetype/omarchy/ \;
          fc-cache -f

          echo 'DPkg::Post-Invoke { "/usr/local/bin/omarchy-fix-desktops || true"; };' > /etc/apt/apt.conf.d/99-omarchy-desktop-guard

          # Deploy ONLY curated WebApps (Bilibili + DeepSeek) + Omarchy Native Browser
          for ic in /root/.local/share/omarchy/applications/icons/*.png; do
            b=$(basename "$ic")
            low=$(echo "$b" | tr '[:upper:]' '[:lower:]' | tr ' ' '-')
            cp -f "$ic" "/root/.local/share/icons/hicolor/256x256/apps/$b"
            cp -f "$ic" "/root/.local/share/icons/hicolor/256x256/apps/$low"
            cp -f "$ic" "/usr/share/pixmaps/$low"
          done
          for f in /root/.local/share/omarchy/applications/Bilibili.desktop /root/.local/share/omarchy/applications/DeepSeek.desktop; do
            [ -f "$f" ] && cp -f "$f" "/root/.local/share/applications/$(basename "$f")"
          done
          cat > /root/.local/share/applications/omarchy-browser.desktop <<'DESK'
          [Desktop Entry]
          Name=Omarchy Browser
          Name[zh_CN]=Omarchy 浏览器
          Comment=Lightweight Native Wayland Browser (WebKitGTK)
          Exec=/usr/local/bin/omarchy-browser
          Icon=web-browser
          Terminal=false
          Type=Application
          Categories=Network;WebBrowser;
          DESK
          cat > /root/.local/share/applications/lazygit.desktop <<'DESK'
          [Desktop Entry]
          Name=Lazygit
          Comment=Terminal UI for Git
          Exec=alacritty -e lazygit
          Icon=git
          Terminal=false
          Type=Application
          Categories=Development;
          DESK

          /usr/local/bin/omarchy-fix-desktops || true
          dpkg-query -W -f='${binary:Package}\t${Version}\n' > "$DOC/packages.tsv"
          apt-get clean
          rm -rf /var/lib/apt/lists/* /tmp/*
          CHROOT

          sudo chroot "$ROOTFS" /usr/local/bin/omarchy-playwright128 check
          sudo chroot "$ROOTFS" /usr/bin/env HOME=/tmp /opt/omarchy-chromium128/browsers/chromium-1129/chrome-linux/chrome --version
          sudo umount "$ROOTFS/dev" "$ROOTFS/proc" "$ROOTFS/sys"
          # Chroot keeps absolute symlinks inside the guest during final cleanup.
          sudo chroot "$ROOTFS" /bin/bash -e <<'CLEAN'
          rm -f /etc/machine-id /var/lib/dbus/machine-id /var/lib/systemd/random-seed
          touch /etc/machine-id
          chmod 644 /etc/machine-id
          ln -s /etc/machine-id /var/lib/dbus/machine-id
          rm -f /etc/resolv.conf
          printf 'nameserver 223.5.5.5\nnameserver 119.29.29.29\nnameserver 8.8.8.8\nnameserver 1.1.1.1\n' > /etc/resolv.conf
          CLEAN
          sudo cp apps/android/container/omarchy.tiny.yaml "$ROOTFS/.tiny.yaml"

          sudo python3 scripts/prepare-initial-image.py --rootfs "$ROOTFS" --source-sha "$GITHUB_SHA" \
            --output-dir "$RUNNER_TEMP/initial-image"

      - name: Upload verified initial installation media
        uses: actions/upload-artifact@v4
        with:
          name: initial-desktop-image-${{ github.sha }}
          path: ${{ runner.temp }}/initial-image/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish:
    if: github.repository == 'Audrey-cn/omarchy-android' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    needs: build-rootfs
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: initial-desktop-image-${{ github.sha }}
          path: image
      - name: Publish versioned initial image
        working-directory: image
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum -c SHA256SUMS
          tag="desktop-ubuntu24-${GITHUB_SHA:0:12}"
          jq -e --arg sha "$GITHUB_SHA" --arg tag "$tag" '.sourceSha == $sha and .id == $tag' image.json
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --prerelease --latest=false --title "Omarchy Ubuntu 24.04 · ${GITHUB_SHA:0:12}" \
            --notes "Initial installation media for the ARM64 Android app (version code 64 or newer). Source commit: $GITHUB_SHA." \
            rootfs.tar.zst image.json catalog.json SHA256SUMS source.json browser-sources.json \
            packages.tsv upstream-components.tsv LICENSES.md
