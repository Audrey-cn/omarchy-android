name: Build Omarchy Android APK Shell

on:
  push:
    branches: [ main ]
    paths:
      - 'core/**'
      - 'scripts/stage-core.sh'
      - 'scripts/android-build.py'
      - 'scripts/prepare-android-managed.py'
      - 'scripts/browser-bundle-sources.json'
      - 'scripts/build-browser-bundle.py'
      - 'runtime/proot-omarchy/**'
      - 'apps/android/**'
      - '.github/workflows/build-android.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'core/**'
      - 'scripts/stage-core.sh'
      - 'scripts/android-build.py'
      - 'scripts/prepare-android-managed.py'
      - 'scripts/browser-bundle-sources.json'
      - 'scripts/build-browser-bundle.py'
      - 'runtime/proot-omarchy/**'
      - 'apps/android/**'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Prepare APK version and test signing
        id: android-build
        env:
          OMARCHY_ANDROID_TEST_KEYSTORE_B64: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && secrets.OMARCHY_ANDROID_TEST_KEYSTORE_B64 || '' }}
          OMARCHY_ANDROID_TEST_KEYSTORE_PASSWORD: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && secrets.OMARCHY_ANDROID_TEST_KEYSTORE_PASSWORD || '' }}
        run: python3 ../../scripts/android-build.py prepare --output-dir "$RUNNER_TEMP/omarchy-android-signing"
      - name: Verify source archives and build pinned browser payload
        run: |
          BUNDLE_DIR="$RUNNER_TEMP/omarchy-browser-managed-payload"
          python3 ../../scripts/build-browser-bundle.py \
            --sources ../../scripts/browser-bundle-sources.json \
            --cache-dir "$RUNNER_TEMP/omarchy-browser-source-cache" \
            --output-dir "$BUNDLE_DIR"
          python3 - "$BUNDLE_DIR/managed-core/manifest.json" "$OMARCHY_ANDROID_SOURCE_SHA" <<'PY'
          import json, sys
          with open(sys.argv[1]) as stream:
              manifest = json.load(stream)
          if manifest["sourceSha"] != sys.argv[2]:
              raise SystemExit("Browser payload source SHA differs from prepared APK metadata")
          print("Prepared pinned browser payload:", len(manifest["files"]), "files from", manifest["sourceSha"])
          PY
          printf 'OMARCHY_ANDROID_MANAGED_PAYLOAD_DIR=%s\n' "$BUNDLE_DIR" >> "$GITHUB_ENV"
      - uses: gradle/actions/setup-gradle@v4
      - name: Accept Android SDK licenses & install CMake/NDK
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37" "build-tools;36.0.0" "cmake;3.22.1" "ndk;27.2.12479018" >/dev/null || true
      - name: Assemble Debug APK
        env:
          OMARCHY_ANDROID_TEST_KEYSTORE_PASSWORD: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && secrets.OMARCHY_ANDROID_TEST_KEYSTORE_PASSWORD || '' }}
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleDebug --no-daemon
      - name: Verify APK certificate and version
        run: |
          python3 ../../scripts/android-build.py verify --apk app/build/outputs/apk/debug/app-debug.apk --metadata "$OMARCHY_ANDROID_BUILD_METADATA" --build-tools "$ANDROID_SDK_ROOT/build-tools/36.0.0"
          cp "$OMARCHY_ANDROID_BUILD_METADATA" app/build/outputs/apk/debug/build-metadata.json
      - name: Upload OmarchyAndroid APK
        uses: actions/upload-artifact@v4
        with:
          name: OmarchyAndroid-apk${{ steps.android-build.outputs.artifact_suffix }}
          path: |
            apps/android/app/build/outputs/apk/debug/app-debug.apk
            apps/android/app/build/outputs/apk/debug/build-metadata.json
          if-no-files-found: error
      - name: Remove runner signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/omarchy-android-signing/test-signing.p12"
