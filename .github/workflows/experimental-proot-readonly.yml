name: Experimental PRoot read-only handles

on:
  pull_request:
    paths:
      - 'experiments/proot-readonly/**'
      - '.github/workflows/experimental-proot-readonly.yml'

permissions:
  contents: read

concurrency:
  group: experimental-proot-readonly-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  cross-compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install build tools
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends build-essential binutils curl patch python3 unzip
      - name: Build control and exact upstream backport
        run: bash experiments/proot-readonly/build-android.sh "$RUNNER_TEMP/proot-readonly-build" "$RUNNER_TEMP/proot-readonly-artifacts"
      - name: Upload experiment only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: experimental-proot-readonly-arm64-${{ github.sha }}
          path: ${{ runner.temp }}/proot-readonly-artifacts/
          retention-days: 7
          if-no-files-found: error
