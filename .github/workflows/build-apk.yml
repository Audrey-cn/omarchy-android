name: Build OmarchyDeck APK

on:
  push:
    branches: [ main ]
    paths:
      - 'apps/deck/**'
      - '.github/workflows/build-apk.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'apps/deck/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Build OmarchyDeck.apk
        run: |
          chmod +x apps/deck/build.sh
          ANDROID_HOME="$ANDROID_SDK_ROOT" ./apps/deck/build.sh
      - name: Upload OmarchyDeck.apk
        uses: actions/upload-artifact@v4
        with:
          name: OmarchyDeck-apk
          path: apps/deck/OmarchyDeck.apk
