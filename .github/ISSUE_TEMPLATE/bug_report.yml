name: Bug report / 问题报告
description: Report a reproducible problem with the app, desktop or runtime / 报告可复现的问题
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Omarchy Android. Search existing issues first and include the details you have. Text steps are welcome; do not clear your desktop or reinstall just to submit a report.
        感谢反馈。请先搜索已有问题，尽量提供以下信息；文字步骤即可，无需为了报告而清数据或重装。请删除日志中的密钥、令牌、账号和私人路径。
  - type: dropdown
    id: route
    attributes:
      label: Runtime route / 运行路线
      options:
        - Rootless Android app / 免 Root 一体 App
        - Root chroot + external Termux:X11 / Root chroot + 外部 Termux:X11
        - External Termux PRoot (+ optional Deck) / 外部 Termux PRoot（可选 Deck）
        - Not sure / 不确定
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and Android version / 设备与 Android 版本
      placeholder: "Redmi K20 Pro; Android 11; vendor ROM/build; ARM64; rooted or rootless"
    validations:
      required: true
  - type: textarea
    id: versions
    attributes:
      label: Versions and installation source / 版本与安装来源
      description: APK version or source commit; initial image ID; desktop/runtime component versions if known. Say whether this is an official build, a fork or a local build.
      placeholder: "APK: …\nImage ID: …\nComponents: …\nDownload/build source: …"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce / 复现步骤
      description: Include the starting state and any relevant settings, keyboard or IME. Tell us if it happens every time or intermittently.
      placeholder: "1. Open …\n2. Tap/run …\n3. Observe …"
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Expected and actual behavior / 预期与实际结果
      description: Paste exact errors when available. If this is a regression, include the last version that worked.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Logs, screenshots or recording / 日志、截图或录屏
      description: Attach relevant evidence if available and redact private data. Include what you already tried; a recording is optional.
